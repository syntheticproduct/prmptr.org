[package]
name = "prmptr"
version = "0.1.0"
description = "WYSIWYG editor for Claude prompts"
authors = ["Camille Lambert"]
license = "MIT"
repository = "https://github.com/syntheticproduct/prmptr.org"
homepage = "https://github.com/syntheticproduct/prmptr.org"
readme = "../README.md"
keywords = ["tauri", "markdown", "editor", "llm", "prompt-engineering"]
categories = ["text-editors", "gui"]
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "prmptr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
thiserror = "2"
arboard = { version = "3", features = ["wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# Release profile tuned for desktop distribution: small binary, no debug
# unwind tables, full link-time optimization. Trades build time for size and
# startup speed — both matter for a desktop app users install once and run
# every day.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

# Dev profile: keep incremental compilation + checked overflow for catching
# bugs early. Mirrors what `cargo build` already does, just made explicit.
[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[lints.rust]
# Forbid `unsafe` outright — there's no reason a Tauri/IPC desktop app
# needs raw pointers, and a regulated user will check.
unsafe_code = "forbid"

[lints.clippy]
# Clippy baseline — `all` covers correctness + style lints that are
# almost always right. We don't enable `pedantic` because it generates
# noise on patterns that are fine in a Tauri app (module name repetition,
# missing must_use, etc.). Tighten by adding specific lints below.
all = { level = "warn", priority = -1 }
# Catch panics on hot paths. These default to allow in clippy; we
# upgrade them to warn so a CI run with `-D warnings` will gate them.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
